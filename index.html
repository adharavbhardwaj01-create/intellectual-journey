<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f5;--ink:#20211f;--muted:#777873;--line:#e5e5e0;--paper:#fff;--accent:#626d58;--soft:#efefe9;--drawer:#fbfbf9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#191a18;--ink:#ecece8;--muted:#9a9b94;--line:#31322f;--paper:#222320;--accent:#9fb08f;--soft:#2a2b28;--drawer:#1f201e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shell{max-width:960px;margin:0 auto;padding:0 28px}
.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}
.mark{width:23px;height:23px;border:1px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:14px}
.mono,.eyebrow,.stat-label{font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hero{padding:64px 0 32px}h1{font-size:clamp(37px,7vw,62px);letter-spacing:-.06em;line-height:1;font-weight:500;margin:18px 0}
.intro{max-width:530px;font-size:15px;line-height:1.7;color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:30px}
.stat{padding:17px 16px 17px 0}.stat+.stat{border-left:1px solid var(--line);padding-left:18px}.stat-number{font-size:24px;letter-spacing:-.04em;font-weight:500}.stat-label{margin-top:5px}
.bar{height:2px;background:var(--line)}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.toolbar{display:flex;gap:10px;align-items:center;margin:32px 0 18px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px;max-width:340px}.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:40px;border:1px solid var(--line);background:transparent;border-radius:5px;padding:0 12px 0 37px;font-size:13px}
.sel{height:40px;background:transparent;border:1px solid var(--line);border-radius:5px;padding:0 10px;font-size:12px}.sel option{background:var(--paper)}
.spacer{flex:1}.btn{border:1px solid var(--line);background:transparent;border-radius:5px;padding:10px 14px;font-size:12px}.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}.btn.primary:hover{opacity:.85;background:var(--ink)}
.phase{border-top:1px solid var(--line)}
.phase-head{width:100%;display:grid;grid-template-columns:40px 1fr auto 20px;gap:12px;align-items:center;text-align:left;background:transparent;border:0;padding:22px 0}
.phase-num{font:11px 'DM Mono',monospace;color:var(--muted)}.phase-title{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em}.phase-desc{display:block;font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.phase-progress{display:flex;align-items:center;gap:10px;color:var(--muted);font:10px 'DM Mono',monospace}.track{height:3px;width:56px;background:var(--line);border-radius:9px;overflow:hidden}.track i{display:block;height:100%;background:var(--accent)}
.chev{color:var(--muted);transition:transform .2s}.open .chev{transform:rotate(90deg)}
.books{padding:0 0 14px 52px}.book{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:13px;padding:17px 0;border-top:1px solid var(--line);align-items:start}
.book-n{font:10px 'DM Mono',monospace;color:var(--muted);padding-top:3px}.book-title{font-size:14px;font-weight:600;line-height:1.4}.book-author{font-size:11px;color:var(--muted);margin-top:3px}
.book-desc{font-size:12px;line-height:1.6;color:var(--muted);margin:8px 0 0;max-width:530px}.tag{font:9px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:3px;padding:2px 5px;margin-left:6px;color:var(--accent);vertical-align:middle}
.actions{display:flex;gap:7px;align-items:center}.status{border:1px solid var(--line);border-radius:4px;background:transparent;font-size:11px;padding:7px 8px;max-width:130px}.status option{background:var(--paper)}
.ib{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);background:transparent;border-radius:4px;color:var(--muted)}.ib:hover{background:var(--soft)}
.done .book-title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}.done .book-n{color:var(--accent)}
.empty{padding:36px 0;text-align:center;font-size:13px;color:var(--muted)}
.footer{border-top:1px solid var(--line);margin-top:40px;padding:23px 0 38px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.tb{border:0;background:transparent;font-size:11px;padding:0;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}.fa{display:flex;gap:16px}
.overlay{position:fixed;inset:0;background:rgba(20,21,18,.4);z-index:10;display:flex;justify-content:flex-end}.overlay[hidden]{display:none}
.drawer{height:100%;width:min(500px,100%);background:var(--drawer);padding:28px;overflow:auto;padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:8px}.dt{font-size:22px;letter-spacing:-.03em;font-weight:500;line-height:1.2;margin:8px 0 0}.da{font-size:12px;color:var(--muted);margin-top:7px}
.field{margin:18px 0}.field label{display:block;font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.field textarea,.field input,.field select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:11px;font-size:13px;line-height:1.6;resize:vertical}.field textarea{min-height:90px}
.db{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:12px;z-index:20}.toast[hidden]{display:none}

.topbar{flex-wrap:wrap}.nav{display:flex;gap:4px}.nav button{border:0;background:transparent;font-size:12px;padding:8px 12px;border-radius:5px;color:var(--muted)}.nav button[aria-current=page]{background:var(--soft);color:var(--ink)}
.pg{padding:56px 0 8px}.pg h2{font-size:clamp(30px,6vw,44px);letter-spacing:-.05em;font-weight:500;margin:14px 0}

.panels{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:30px 0}.panels h3{font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:400;margin:0 0 12px}
.row{display:grid;grid-template-columns:104px 1fr 24px;gap:10px;align-items:center;font-size:12px;margin:9px 0}.row .track{width:auto;height:6px}.row b{font:11px 'DM Mono',monospace;font-weight:400;color:var(--muted);text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 11px;font-size:11px;color:var(--muted)}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{border-top:1px solid var(--line);padding:22px 0;display:grid;grid-template-columns:36px 1fr;gap:13px}.card .chips{margin:10px 0 0}.card .chip{font-size:10px;padding:3px 8px;cursor:default}
.line{margin:12px 0 0;padding-left:12px;border-left:2px solid var(--accent);font-size:13px;font-style:italic;line-height:1.6}.line small{display:block;font:9px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.1em;font-style:normal;color:var(--muted);margin-bottom:4px}
.links{display:flex;gap:14px;margin-top:12px;font-size:11px;flex-wrap:wrap}.links a{color:var(--muted)}.meta{font:10px 'DM Mono',monospace;color:var(--muted);margin-top:3px}
.ck{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}.ck input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:none}.ck.d .book-title{text-decoration:line-through;color:var(--muted)}
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0}.analytic{border-top:1px solid var(--line);padding:18px 0}.analytic h3{font:10px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:400;margin:0 0 15px}.metric-big{font-size:30px;letter-spacing:-.05em}.mini-bars{display:flex;align-items:flex-end;gap:7px;height:90px;border-bottom:1px solid var(--line);padding:0 0 1px}.mini-bar{flex:1;min-width:0;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;position:relative}.mini-bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font:9px "DM Mono",monospace;color:var(--muted)}.session-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:12px}.heatmap{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}.heat{aspect-ratio:1;border-radius:2px;background:var(--soft);border:1px solid var(--line)}.heat[data-level="1"]{background:color-mix(in srgb,var(--accent) 25%,var(--bg))}.heat[data-level="2"]{background:color-mix(in srgb,var(--accent) 50%,var(--bg))}.heat[data-level="3"]{background:var(--accent)}.sync-state{font-size:11px;color:var(--muted);line-height:1.6}.codebox{font:10px "DM Mono",monospace;white-space:pre-wrap;background:var(--soft);padding:12px;border-radius:4px;overflow-wrap:anywhere}.ph-h{font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:30px 0 6px}
@media(max-width:620px){.analytics-grid{grid-template-columns:1fr}.heatmap{grid-template-columns:repeat(7,minmax(0,1fr))}.cards{grid-template-columns:1fr 1fr}.cards .stat:nth-child(3){padding-left:0;border-left:0}.cards .stat:nth-child(n+3){border-top:1px solid var(--line)}.panels{grid-template-columns:1fr}.topbar{height:auto;padding:12px 0}.shell{padding:0 18px}.hero{padding-top:48px}.phase-head{grid-template-columns:26px 1fr auto 16px;gap:8px}.track{width:28px}.books{padding-left:0}.book{grid-template-columns:25px minmax(0,1fr);gap:9px}.actions{grid-column:2}.search{max-width:none}.spacer{display:none}.toolbar .sel,.toolbar .btn{flex:1}.drawer{padding-left:18px;padding-right:18px}}
</style>
</head>

</div>

</div>
<div class="overlay" id="ov" hidden></div><div class="toast" id="toast" hidden></div>
<script>
const BASE={"phases": [{"id": 1, "title": "Build your thinking", "description": "Clear thinking, communication, and argument."}, {"id": 2, "title": "Understand people", "description": "Psychology, persuasion, attention, and behaviour."}, {"id": 3, "title": "The human condition", "description": "Fiction and memoir exploring identity, power, and meaning."}, {"id": 4, "title": "Power & society", "description": "Institutions, social roles, politics, and influence."}, {"id": 5, "title": "Justice & institutions", "description": "Political philosophy, fairness, and how systems work."}, {"id": 6, "title": "Meaning & philosophy", "description": "Competing ideas about ethics, happiness, nihilism, and the absurd."}], "books": [{"id": 1, "title": "The Change Book", "author": "Mikael Krogerus and Roman Tschäppeler", "description": "Practical models for understanding decisions, problems, and change.", "phase": 1}, {"id": 2, "title": "Essentialism: The Disciplined Pursuit of Less", "author": "Greg McKeown", "description": "Distinguish what matters from what merely demands your attention.", "phase": 1}, {"id": 3, "title": "Think Faster, Talk Smarter", "author": "Matt Abrahams", "description": "Spontaneous speaking, thinking on your feet, and answering unexpected questions.", "phase": 1}, {"id": 4, "title": "Thank You for Arguing", "author": "Jay Heinrichs", "description": "Rhetoric, persuasion, and the structure of arguments.", "phase": 1}, {"id": 5, "title": "How to Argue and Win Every Time", "author": "Gerry Spence", "description": "Making a case and communicating persuasively.", "phase": 1}, {"id": 6, "title": "Objections", "author": "Jeb Blount", "description": "Handling objections and improving communication.", "phase": 1}, {"id": 7, "title": "Thinking, Fast and Slow", "author": "Daniel Kahneman", "description": "Intuition, deliberate reasoning, cognitive biases, and judgement.", "phase": 2}, {"id": 8, "title": "Influence: The Psychology of Persuasion", "author": "Robert Cialdini", "description": "Why people comply with requests and how persuasion works.", "phase": 2}, {"id": 9, "title": "Surrounded by Idiots", "author": "Thomas Erikson", "description": "Communication styles; treat the four-colour framework critically.", "phase": 2}, {"id": 10, "title": "Spy the Lie", "author": "Philip Houston, Michael Floyd, and Susan Carnicero", "description": "Questioning techniques and deception detection; behaviour alone cannot prove a lie.", "phase": 2}, {"id": 11, "title": "Flow: The Psychology of Optimal Experience", "author": "Mihaly Csikszentmihalyi", "description": "Deep engagement, challenge, attention, and absorbing activities.", "phase": 2}, {"id": 12, "title": "The Body Keeps the Score", "author": "Bessel van der Kolk", "description": "Trauma and its relationship to memory, emotions, and the body.", "phase": 2}, {"id": 13, "title": "Animal Farm", "author": "George Orwell", "description": "Power, propaganda, revolution, and the corruption of political ideals.", "phase": 3}, {"id": 14, "title": "1984", "author": "George Orwell", "description": "Surveillance, language, political control, and truth.", "phase": 3}, {"id": 15, "title": "The Metamorphosis", "author": "Franz Kafka", "description": "Alienation, identity, family obligations, and social usefulness.", "phase": 3}, {"id": 16, "title": "Man's Search for Meaning", "author": "Viktor Frankl", "description": "Suffering, meaning, and human dignity.", "phase": 3}, {"id": 17, "title": "Crime and Punishment", "author": "Fyodor Dostoevsky", "description": "Guilt, morality, rationalisation, conscience, and consequences.", "phase": 3}, {"id": 18, "title": "The Name of the Rose", "author": "Umberto Eco", "description": "A historical mystery about knowledge, interpretation, authority, and certainty.", "phase": 3}, {"id": 19, "title": "The Prince", "author": "Niccolò Machiavelli", "description": "Political survival, leadership, reputation, and political necessity.", "phase": 4}, {"id": 20, "title": "The 48 Laws of Power", "author": "Robert Greene", "description": "Strategic interpretations of power and historical anecdotes.", "phase": 4}, {"id": 21, "title": "The Art of Seduction", "author": "Robert Greene", "description": "Charisma, attraction, and influence; consider the ethics of manipulation.", "phase": 4}, {"id": 22, "title": "The Presentation of Self in Everyday Life", "author": "Erving Goffman", "description": "Impression management and how people present themselves socially.", "phase": 4}, {"id": 23, "title": "The Sociological Imagination", "author": "C. Wright Mills", "description": "Connect personal experiences with historical and social forces.", "phase": 4}, {"id": 24, "title": "Suicide", "author": "Émile Durkheim", "description": "A foundational sociological study of social integration and regulation.", "phase": 4}, {"id": 25, "title": "The Protestant Ethic and the Spirit of Capitalism", "author": "Max Weber", "description": "The historical relationship between religious ideas, work, and capitalism.", "phase": 4}, {"id": 26, "title": "The Republic", "author": "Plato", "description": "Justice, education, political authority, the ideal state, and knowledge.", "phase": 5}, {"id": 27, "title": "Private Government", "author": "Elizabeth Anderson", "description": "Authority and freedom in the workplace and private employment.", "phase": 5}, {"id": 28, "title": "A Theory of Justice", "author": "John Rawls", "description": "Fairness, equal basic liberties, and principles for a just society.", "phase": 5}, {"id": 29, "title": "Golden Rule", "author": "Thomas Ferguson", "description": "Money, investment, and party competition in politics; verify exact edition.", "phase": 5}, {"id": 30, "title": "Principles", "author": "Ray Dalio", "description": "Decision-making systems, feedback, and organisational principles.", "phase": 5}, {"id": 31, "title": "The Apology of Socrates", "author": "Plato", "description": "Socratic questioning, intellectual humility, and defending beliefs.", "phase": 6}, {"id": 32, "title": "The Art of Happiness", "author": "Epicurus (as listed)", "description": "Epicurean ideas about pleasure, tranquillity, friendship, and fear; verify edition.", "phase": 6}, {"id": 33, "title": "The Birth of Tragedy", "author": "Friedrich Nietzsche", "description": "Greek tragedy and the tension between Apollonian order and Dionysian excess.", "phase": 6}, {"id": 34, "title": "Nihilism", "author": "Nolen Gertz", "description": "Nihilism as a philosophical problem and a feature of modern life.", "phase": 6}, {"id": 35, "title": "The Myth of Sisyphus", "author": "Albert Camus", "description": "The absurd and the search for meaning in a world without clear answers.", "phase": 6}, {"id": 36, "title": "Initiation", "author": "Elisabeth Haich", "description": "A spiritual and esoteric perspective; evaluate metaphysical claims critically.", "phase": 6}]};
const KEY='intellectual-journey-v2',ST=['Not Started','Reading','Completed','Paused'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){for(const k of [KEY,'intellectual-journey-v1']){try{const r=JSON.parse(localStorage.getItem(k)||'null');if(r)return{statuses:r.statuses||{},notes:r.notes||{},books:r.books||[],phases:r.phases||[],sessions:Array.isArray(r.sessions)?r.sessions:[],activity:Array.isArray(r.activity)?r.activity:[]}}catch(e){}}return{statuses:{},notes:{},books:[],phases:[]}}
let S=load();S.sessions=S.sessions||[];S.activity=S.activity||[];const U={open:new Set([1]),q:'',fs:'all',so:'order'};
const CLOUD_KEY='intellectual-journey-cloud-v1';let cloudClient=null,cloudUser=null;const cloudConfig=()=>{try{return JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}')}catch{return {}}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

function modal(h,sm){$('#ov').innerHTML='<div class="drawer" role="dialog" aria-modal="true">'+h+'</div>';$('#ov').hidden=false;const f=$('#ov input,#ov textarea');if(f)f.focus()}
const xbtn='<button class="ib" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
function ask(msg,fn){modal('<div class="dh"><div><div class="eyebrow">Please confirm</div><p class="dt" style="font-size:17px">'+esc(msg)+'</p></div>'+xbtn+'</div><div class="db"><button class="btn primary" id="yes">Confirm</button><button class="btn" data-close>Cancel</button></div>');$('#yes').onclick=()=>{close();fn()}}
function stats(){const b=books(),t=b.length,c=b.filter(x=>stat(x.id)==='Completed').length,r=b.filter(x=>stat(x.id)==='Reading').length,p=t?Math.round(c/t*100):0;
$('#s1').innerHTML=c+'<span style="color:var(--muted)"> / '+t+'</span>';$('#s2').textContent=String(r).padStart(2,'0');$('#s3').textContent=p+'%';$('#bar').style.width=p+'%';
$('#intro').textContent=t+' books on philosophy, psychology, literature, power, and the human condition. One step at a time — and room for whatever you read next.';

if(a==='ph'){U.open.has(id)?U.open.delete(id):U.open.add(id);list()}else if(a==='nt')notes(id);
else if(a==='del')ask('Remove this book and its notes?',()=>{S.books=S.books.filter(b=>b.id!==id);delete S.notes[id];delete S.statuses[id];save();render()})};
$('#list').onchange=e=>{const t=e.target.closest('[data-act="st"]');if(t){S.statuses[t.dataset.id]=t.value;S.activity.push({at:new Date().toISOString(),bookId:+t.dataset.id,type:'status',value:t.value});save();render()}};

function cloudStatus(label){const b=$('#cloudBtn');if(b)b.textContent='Cloud sync · '+label}
function cloudModal(){
 const c=cloudConfig();
 modal(`<div class="dh"><div><div class="eyebrow">Optional · Supabase</div><h2 class="dt">Cloud sync</h2><div class="da">Sync your roadmap, journals, sessions and progress across devices.</div></div>${xbtn}</div>
 <p class="sync-state">Cloud sync needs your own free Supabase project. Until configured, the app continues saving locally in this browser. Your Supabase anon key is designed for browser use only when Row Level Security is enabled.</p>
 <div class="field"><label for="sb_url">Project URL</label><input id="sb_url" placeholder="https://your-project.supabase.co" value="${esc(c.url||'')}"></div>
 <div class="field"><label for="sb_key">Publishable / anon key</label><input id="sb_key" placeholder="sb_publishable_… or legacy anon key" value="${esc(c.key||'')}"></div>
 <div class="db"><button class="btn primary" id="saveCloud">Save configuration</button><button class="btn" id="cloudLogin">Email sign in</button><button class="btn" id="cloudPull">Pull cloud data</button><button class="btn" id="cloudPush">Push local data</button><button class="btn" id="cloudLogout">Sign out</button></div>
 <div class="field"><label>Database setup · run once in Supabase SQL Editor</label><div class="codebox">${esc("create table if not exists public.reading_journey_sync (\\n  user_id uuid primary key references auth.users(id) on delete cascade,\\n  payload jsonb not null default '{}'::jsonb,\\n  updated_at timestamptz not null default now()\\n);\\nalter table public.reading_journey_sync enable row level security;\\ncreate policy Users_manage_own_reading_data on public.reading_journey_sync\n  for all using (auth.uid() = user_id) with check (auth.uid() = user_id);")}</div></div>
 <p class="note" id="cloudMsg">Status: ${cloudUser?'Signed in as '+esc(cloudUser.email):'Not signed in'}. Configure Supabase and run the SQL above before syncing.</p>
 <p class="note">Sign-in uses an email magic link. Configure your deployed site URL in Supabase Authentication → URL Configuration. For reliable cross-device sync, host this file on HTTPS rather than opening it as file://.</p>`);
 $('#saveCloud').onclick=()=>{const url=$('#sb_url').value.trim().replace(/\/+$/,'');const key=$('#sb_key').value.trim();if(!url.startsWith('https://')||!key){$('#cloudMsg').textContent='Enter a valid HTTPS project URL and publishable/anon key.';return}
 localStorage.setItem(CLOUD_KEY,JSON.stringify({url,key}));initCloud();$('#cloudMsg').textContent='Configuration saved. Next, sign in with your email.';toast('Cloud configuration saved')};
 $('#cloudLogin').onclick=async()=>{try{await initCloud();if(!cloudClient)throw Error('Save a valid project URL and key first.');const email=prompt('Enter the email address for your magic sign-in link:');if(!email)return;const {error}=await cloudClient.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});if(error)throw error;$('#cloudMsg').textContent='Magic link requested. Check your email, open the link on this device, then reopen Cloud sync.'}catch(e){$('#cloudMsg').textContent='Sign-in error: '+e.message}};
 $('#cloudPush').onclick=async()=>{try{await pushCloud();$('#cloudMsg').textContent='Local data uploaded to your account.';toast('Cloud backup updated')}catch(e){$('#cloudMsg').textContent='Sync error: '+e.message}};
 $('#cloudPull').onclick=async()=>{try{if(!confirm('Replace this browser’s current reading data with the cloud copy? Export a backup first if unsure.'))return;await pullCloud();$('#cloudMsg').textContent='Cloud data restored to this browser.';render();toast('Cloud data restored')}catch(e){$('#cloudMsg').textContent='Sync error: '+e.message}};
 $('#cloudLogout').onclick=async()=>{try{if(cloudClient)await cloudClient.auth.signOut();cloudUser=null;cloudStatus('Off');$('#cloudMsg').textContent='Signed out. Local data remains on this device.'}catch(e){$('#cloudMsg').textContent=e.message}};
}
async function initCloud(){
 const c=cloudConfig();
 if(!c.url||!c.key||!window.supabase){cloudClient=null;cloudStatus('Off');return null}
 cloudClient=window.supabase.createClient(c.url,c.key);
 const {data,error}=await cloudClient.auth.getSession();if(error)throw error;
 cloudUser=data.session?.user||null;cloudStatus(cloudUser?'Connected':'Ready');return cloudClient;
}
async function requireCloudUser(){
 const client=await initCloud();if(!client)throw Error('Configure Supabase first using Cloud sync.');
 if(!cloudUser){cloudModal();throw Error('Sign in with your email first.')}
 return client;
}
async function pushCloud(){
 const client=await requireCloudUser();
 const payload={version:3,statuses:S.statuses,notes:S.notes,books:S.books,phases:S.phases,sessions:S.sessions||[],activity:S.activity||[]};
 const {error}=await client.from('reading_journey_sync').upsert({user_id:cloudUser.id,payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;
}
async function pullCloud(){
 const client=await requireCloudUser();
 const {data,error}=await client.from('reading_journey_sync').select('payload').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;if(!data)throw Error('No cloud backup found for this account yet. Push local data first.');
 const p=data.payload||{};S={statuses:p.statuses||{},notes:p.notes||{},books:Array.isArray(p.books)?p.books:[],phases:Array.isArray(p.phases)?p.phases:[],sessions:Array.isArray(p.sessions)?p.sessions:[],activity:Array.isArray(p.activity)?p.activity:[]};save();
}
$('#cloudBtn').onclick=cloudModal;
initCloud().catch(()=>cloudStatus('Off'));

render();
</script>
</body>
</html>
